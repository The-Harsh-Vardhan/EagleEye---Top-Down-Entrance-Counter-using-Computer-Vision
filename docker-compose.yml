# =============================================================================
# EagleEye Docker Compose Configuration
# =============================================================================
# Usage:
#   docker-compose up -d              # Start all services
#   docker-compose up dashboard       # Start dashboard only
#   docker-compose logs -f            # View logs
#   docker-compose down               # Stop all services
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Dashboard Service - Streamlit Web Interface
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: eagleeye-dashboard
    ports:
      - "8501:8501"
    volumes:
      # Persist database
      - eagleeye_data:/app/data
      # Persist logs
      - eagleeye_logs:/app/logs
      # Mount YOLO model (optional - avoids re-downloading)
      - ./yolov8n.pt:/app/yolov8n.pt:ro
    environment:
      - EAGLEEYE_LOG_LEVEL=INFO
      - EAGLEEYE_DATABASE_PATH=/app/data/eagle_eye.db
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8501/_stcore/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Counter Service - Main People Counting Application
  # ---------------------------------------------------------------------------
  counter:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: eagleeye-counter
    volumes:
      # Persist database (shared with dashboard)
      - eagleeye_data:/app/data
      # Persist logs
      - eagleeye_logs:/app/logs
      # Mount YOLO model
      - ./yolov8n.pt:/app/yolov8n.pt:ro
      # Mount video files for testing (optional)
      - ./Dataset:/app/Dataset:ro
    environment:
      - EAGLEEYE_LOG_LEVEL=INFO
      - EAGLEEYE_DATABASE_PATH=/app/data/eagle_eye.db
    # Override default command to run the counter
    # Customize --source for your camera/video
    command: >
      python main.py  --source /app/Dataset/test1.mp4  --no-display  --line-position 0.5
    # For webcam access (Linux), uncomment:
    # devices:
    #   - /dev/video0:/dev/video0
    profiles:
      - counter # Only start with: docker-compose --profile counter up
    depends_on:
      - dashboard

  # ---------------------------------------------------------------------------
  # Development Service
  # ---------------------------------------------------------------------------
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: eagleeye-dev
    volumes:
      # Mount source code for live editing
      - .:/app
      - eagleeye_data:/app/data
    environment:
      - EAGLEEYE_LOG_LEVEL=DEBUG
    stdin_open: true
    tty: true
    profiles:
      - dev # Only start with: docker-compose --profile dev up

# =============================================================================
# Volumes
# =============================================================================
volumes:
  eagleeye_data:
    driver: local
  eagleeye_logs:
    driver: local

# =============================================================================
# Networks (optional - for multi-container setups)
# =============================================================================
networks:
  default:
    name: eagleeye-network
